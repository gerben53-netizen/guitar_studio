services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?Set POSTGRES_TEST_DB in .env}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-test-db.sh:/docker-entrypoint-initdb.d/01-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ['npm', 'run', 'migrate']
    environment: &api_env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db}
    depends_on:
      db: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    environment: *api_env
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: ['npm', 'run', 'dev', '-w', '@guitar/web', '--', '--port', '5173']
    environment:
      API_PROXY_TARGET: http://api:3000
    ports: ['127.0.0.1:5173:5173']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
