name: Foundation CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: guitar_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U ci -d guitar_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci-ephemeral-only@localhost:5432/guitar_dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure isolated test database
        run: echo "TEST_DATABASE_URL=postgres://ci:ci-ephemeral-only@localhost:$PGPORT/guitar_test" >> "$GITHUB_ENV"
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run design:check
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations twice (idempotency)
        run: npm run migrate && npm run migrate
        env:
          NODE_ENV: test
      - run: npm run test:integration
      - name: Frontend build
        run: npm run build -w @guitar/web
      - name: Backend build
        run: npm run build -w @guitar/api
      - run: npm audit --audit-level=moderate
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Docker build
        run: docker build -f infrastructure/docker/Dockerfile -t guitar-studio:ci .
      - name: Compose startup and HTTP smoke test
        shell: bash
        run: |
          export POSTGRES_USER=ci POSTGRES_PASSWORD=ci-ephemeral-only
          export POSTGRES_DB=guitar_dev POSTGRES_TEST_DB=guitar_test
          export DATABASE_URL=postgres://ci:ci-ephemeral-only@db:5432/guitar_dev
          docker compose -p guitar-ci up -d --build --wait
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:5173/health
          curl --fail http://localhost:5173/
      - name: Load original demo fixtures into disposable CI database
        run: docker compose -p guitar-ci run --rm --no-deps api npm run seed:demo
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: guitar_dev
          POSTGRES_TEST_DB: guitar_test
          DATABASE_URL: postgres://ci:ci-ephemeral-only@db:5432/guitar_dev
      - name: Chromium functional, responsive and accessibility acceptance
        run: npm run test:browser
        env:
          PLAYWRIGHT_SCREENSHOT_DIR: test-results/sprint-2f-regression
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: song-workspace-v3-browser-evidence
          path: |
            playwright-report/
            test-results/
            docs/qa/screenshots/sprint-1/
      - name: Container diagnostics
        if: failure()
        run: docker ps -a && docker logs guitar-ci-api-1 || true
      - name: Stop CI containers
        if: always()
        run: docker compose -p guitar-ci down
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: guitar_dev
          POSTGRES_TEST_DB: guitar_test
          DATABASE_URL: postgres://ci:ci-ephemeral-only@db:5432/guitar_dev
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 detect --source=/repo --redact --verbose
