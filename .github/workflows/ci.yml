name: Foundation CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: guitar_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U ci -d guitar_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci-ephemeral-only@localhost:${{ job.services.postgres.ports[5432] }}/guitar_dev
      TEST_DATABASE_URL: postgres://ci:ci-ephemeral-only@localhost:${{ job.services.postgres.ports[5432] }}/guitar_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations twice (idempotency)
        run: npm run migrate && npm run migrate
        env:
          NODE_ENV: test
      - run: npm run test:integration
      - name: Frontend build
        run: npm run build -w @guitar/web
      - name: Backend build
        run: npm run build -w @guitar/api
      - run: npm audit --audit-level=moderate
      - name: Docker build
        run: docker build -f infrastructure/docker/Dockerfile -t guitar-studio:ci .
      - name: Compose startup and HTTP smoke test
        shell: bash
        run: |
          export POSTGRES_USER=ci POSTGRES_PASSWORD=ci-ephemeral-only
          export POSTGRES_DB=guitar_dev POSTGRES_TEST_DB=guitar_test
          export DATABASE_URL=postgres://ci:ci-ephemeral-only@db:5432/guitar_dev
          docker compose -p guitar-ci up -d --build --wait
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:5173/health
          curl --fail http://localhost:5173/
      - name: Container diagnostics
        if: failure()
        run: docker ps -a && docker logs guitar-ci-api-1 || true
      - name: Stop CI containers
        if: always()
        run: docker compose -p guitar-ci down
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: guitar_dev
          POSTGRES_TEST_DB: guitar_test
          DATABASE_URL: postgres://ci:ci-ephemeral-only@db:5432/guitar_dev
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 detect --source=/repo --redact --verbose
